<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE-edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caleb Abrams Personal Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <a href="./index.html" class="name-logo">Caleb.</a>
      <nav class="navbar">
        <a href="./index.html">Home</a>
        <a href="./about.html">About</a>
        <a href="./projects.html">Projects</a>
        <a href="./tools-and-technologies.html">Tools & Technologies</a>
        <a href="./skills.html">Skills</a>
        <a href="./contact.html" class="active">Contact</a>
      </nav>
    </header>
    <div class="contact">
      <div class="contact-info">
        <h1>LET'S GET IN TOUCH.</h1>
        <h3>I'd like to work with <strong>you</strong></h3>
        <p>
          Have a project in mind or need help building something? Send me a
          message with a few details and I’ll get back to you as soon as
          possible.
        </p>
        <div class="contact-soc">
          <a href="https://github.com/uknowgit882" target="_blank"
            ><i class="bx bxl-github"></i
          ></a>
          <a href="https://www.linkedin.com/in/calebabrams/" target="_blank"
            ><i class="bx bxl-linkedin"></i
          ></a>
        </div>
      </div>
      <form action="https://formspree.io/f/maqkgrld" method="POST">
        <div class="form-container">
          <h1>Contact Form</h1>
          <input
            type="text"
            name="first"
            placeholder="First Name"
            autocomplete="off"
            required
          />
          <input
            type="text"
            name="last"
            placeholder="Last Name"
            autocomplete="off"
            required
          />
          <input
            type="email"
            name="email"
            placeholder="Email"
            autocomplete="off"
            required
          />
          <textarea
            rows="5"
            cols="60"
            name="message"
            placeholder="Message"
            autocomplete="off"
            required
          ></textarea>
          <div class="btn-box">
            <a href="#" onclick="this.closest('form').submit()">Send</a>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
